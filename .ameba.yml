Globs:
  - src/**/*.cr
  - spec/**/*.cr

Excluded:
  - .agents/**
  - lib/**
  - bin/**
  - .shards/**
  - docs/build/**
  - docs/technical/api/**
  - public/**
  - scratch/**

Layout/LineLength:
  Enabled: true
  MaxLength: 120

Style/GuardClause:
  Enabled: true

Metrics/CyclomaticComplexity:
  Enabled: true
  MaxComplexity: 10
