<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101d" />
      <stop offset="50%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="shardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2" />

  <!-- Geometric Grid Accent -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200" />
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320" />
  </g>

  <!-- Geometric Crystal Shard Icon -->
  <g transform="translate(100, 60)">
    <polygon points="100,10 160,50 170,140 100,180 40,130 30,60" fill="url(#shardGrad)" stroke="url(#accent)" stroke-width="3" filter="url(#glow)" />
    <polygon points="100,10 100,180 30,60" fill="#ffffff" fill-opacity="0.2" />
    <polygon points="100,10 100,180 160,50" fill="#6ee7b7" fill-opacity="0.3" />
    <polygon points="30,60 100,180 40,130" fill="#34d399" fill-opacity="0.4" />
    <polygon points="160,50 100,180 170,140" fill="#059669" fill-opacity="0.5" />
  </g>

  <!-- Typography -->
  <g transform="translate(340, 115)">
    <!-- Project Title -->
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-0.02em">
      crystal-tpm2-tss
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="url(#accent)" letter-spacing="0.01em">
      Native TPM 2.0 Software Stack &amp; FIDO2 P-256 Key Manager
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 115)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="60" y="17" fill="#34d399" text-anchor="middle">Crystal 1.21+</text>

      <rect x="132" y="0" width="140" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="202" y="17" fill="#38bdf8" text-anchor="middle">TPM 2.0 TCG</text>

      <rect x="284" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="344" y="17" fill="#818cf8" text-anchor="middle">FIDO2 P-256</text>

      <rect x="416" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="483.5" y="17" fill="#a78bfa" text-anchor="middle">GPLv3 / FDLv1.3</text>
    </g>
  </g>
</svg>
