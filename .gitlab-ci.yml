workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  image: crystallang/crystal:latest-alpine
  interruptible: true
  retry:
    max: 2
    when: runner_system_failure
  timeout: 15m
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - lib/
      - bin/

stages:
  - test
  - deploy

test:
  stage: test
  before_script:
    - apk add --no-cache make git openssl-dev pcre2-dev yaml-dev yaml-static
  script:
    - make all

pages:
  stage: deploy
  needs: ["test"]
  cache: []
  script:
    - crystal docs --output=docs/technical/api
    - mkdir -p public
    - cp -r docs/* public/
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
